name: CI

# Se ejecuta en cada push y en cada Pull Request: compila, corre TODAS las pruebas contra un PostgreSQL real
# y comprueba que la imagen de Docker se construye.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLORAVIA_TEST_CONN: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=floravia_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore Floravia.slnx

      - name: Compilar
        run: dotnet build Floravia.slnx -c Release --no-restore

      - name: Pruebas (unitarias, de negocio y de integración de la API)
        run: dotnet test Floravia.slnx -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: "**/TestResults/*.trx"

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de la API
        run: docker build -f api/Dockerfile -t floravia-api:ci .
